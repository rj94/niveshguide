# Railway: deploy from repo root with this Dockerfile, or set service
# root to backend/ and use Nixpacks (uvicorn main:app --host 0.0.0.0 --port $PORT).

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
